[project]
name = "senec-mqtt-gateway"
version = "0.1.0"
description = "Local MQTT gateway for SENEC.Home V2 and V3 battery systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiomqtt>=2.3",
]

[project.scripts]
senec-mqtt-gateway = "senec_mqtt_gateway.__main__:main"

[dependency-groups]
dev = [
    "amqtt>=0.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senec_mqtt_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
